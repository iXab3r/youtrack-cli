<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="People, AI agents and Node.js code use one youtrack-cli command tree, which applies profiles, the secret store, a permission gate and output scrubbing before calling the YouTrack REST API"><rect width="880" height="330" rx="10" fill="#fcfcfb"/><rect x="16" y="40" width="190" height="64" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="111" y="69" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">People</text><text x="111" y="87" text-anchor="middle" font-size="12" fill="#52514e">readable tables and records</text><path d="M206 72 C241 72 241 165 269 165" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M276 165 l-8 -4.5 v9 z" fill="#52514e"/><rect x="16" y="133" width="190" height="64" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="111" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">AI agents and scripts</text><text x="111" y="180" text-anchor="middle" font-size="12" fill="#52514e">--json  ·  --json-rpc</text><path d="M206 165 C241 165 241 165 269 165" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M276 165 l-8 -4.5 v9 z" fill="#52514e"/><rect x="16" y="226" width="190" height="64" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="111" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Node.js code</text><text x="111" y="273" text-anchor="middle" font-size="12" fill="#52514e">import the same operations</text><path d="M206 258 C241 258 241 165 269 165" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M276 165 l-8 -4.5 v9 z" fill="#52514e"/><rect x="276" y="20" width="330" height="290" rx="10" fill="none" stroke="#256abf" stroke-width="1.5"/><text x="441" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">youtrack-cli</text><text x="441" y="67" text-anchor="middle" font-size="12" fill="#52514e">one command tree, 289 commands</text><rect x="294" y="84" width="294" height="46" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="441" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Profiles</text><text x="441" y="122" text-anchor="middle" font-size="12" fill="#52514e">several servers, isolated settings</text><rect x="294" y="138" width="294" height="46" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="441" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Secret store</text><text x="441" y="176" text-anchor="middle" font-size="12" fill="#52514e">tokens encrypted, never in arguments</text><rect x="294" y="192" width="294" height="46" rx="8" fill="#256abf" stroke="#256abf"/><text x="441" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Permission gate</text><text x="441" y="230" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9">ReadOnly on · Update off until granted</text><rect x="294" y="246" width="294" height="46" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="441" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Output scrubbing</text><text x="441" y="284" text-anchor="middle" font-size="12" fill="#52514e">tokens and signed URLs removed</text><rect x="676" y="110" width="188" height="110" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="770" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">YouTrack REST API</text><text x="770" y="180" text-anchor="middle" font-size="12" fill="#52514e">282 of 282 operations</text><path d="M606 165 C641 165 641 165 669 165" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M676 165 l-8 -4.5 v9 z" fill="#52514e"/></svg>
